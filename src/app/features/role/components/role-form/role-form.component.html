<z-card
  [zTitle]="isEdit ? 'Chỉnh sửa role' : 'Thêm role mới'"
  zDescription="Quản lý vai trò và phân quyền hệ thống"
  class="role-form-card"
>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

    <!-- Code -->
    <z-form-field>
      <label z-form-label zRequired>Role Code</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="code"
          placeholder="Ví dụ: ADMIN"
        />
      </z-form-control>
    </z-form-field>

    <!-- Name -->
    <z-form-field>
      <label z-form-label zRequired>Role Name</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="name"
          placeholder="Ví dụ: Administrator"
        />
      </z-form-control>
    </z-form-field>

    <!-- Description -->
    <z-form-field>
      <label z-form-label>Mô tả</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="description"
          placeholder="Nhập mô tả role"
        />
      </z-form-control>
    </z-form-field>

    <!-- Status -->
    <z-form-field>
      <label z-form-label>Status</label>
      <z-form-control>
        <z-select formControlName="status" zPlaceholder="Chọn trạng thái">
          <z-select-item zValue="ACTIVE">ACTIVE</z-select-item>
          <z-select-item zValue="INACTIVE">INACTIVE</z-select-item>
        </z-select>
      </z-form-control>
    </z-form-field>

    <z-divider />

    <!-- Permissions -->
    <div class="permission-section">

      <h3 class="font-medium mb-3">Permissions</h3>

      <div class="permission-grid">

        <label
          *ngFor="let p of permissions"
          class="permission-item"
        >
          <input
            type="checkbox"
            [value]="p.id"
            (change)="togglePermission(p.id, $event)"
            [checked]="selectedPermissions.includes(p.id)"
          />

          {{ p.code }}

        </label>

      </div>

    </div>

    <z-divider />

    <!-- Actions -->
    <div class="flex justify-start gap-3 mt-6">

      <a z-button zType="outline" routerLink="/settings/roles">
        Hủy
      </a>

      <button
        z-button
        zType="default"
        type="submit"
        [zDisabled]="form.invalid || isLoading"
      >
        {{ isEdit ? 'Cập nhật' : 'Thêm mới' }}
      </button>

    </div>

  </form>

</z-card>
