<z-card [zTitle]="isEdit ? 'Chỉnh sửa nhân viên' : 'Thêm nhân viên mới'" zDescription="Quản lý thông tin nhân viên"
    class="staff-form-card">
    <form [formGroup]="staffForm" (ngSubmit)="submitForm()" class="space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Tên nhân viên -->
            <z-form-field class="md:col-span-2">
                <label z-form-label zRequired>Tên nhân viên</label>
                <z-form-control>
                    <input z-input type="text" formControlName="fullName" placeholder="Nhập tên nhân viên" />
                </z-form-control>
            </z-form-field>

            <!-- Chức vụ -->
            <z-form-field class="md:col-span-2">
                <label z-form-label zRequired>Chức vụ</label>
                <z-form-control>
                    <z-select formControlName="position" zPlaceholder="Chọn chức vụ">
                        <z-select-item zValue="STAFF">Nhân viên (STAFF)</z-select-item>
                        <z-select-item zValue="WAREHOUSE">Thủ kho (WAREHOUSE)</z-select-item>
                    </z-select>
                </z-form-control>
            </z-form-field>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Email -->
            <z-form-field class="md:col-span-2">
                <label z-form-label zRequired>Email</label>
                <z-form-control>
                    <input z-input type="email" formControlName="email" placeholder="Nhập email" />
                </z-form-control>
            </z-form-field>

            <!-- Số điện thoại -->
            <z-form-field class="md:col-span-2">
                <label z-form-label zRequired>Số điện thoại</label>
                <z-form-control>
                    <input z-input type="tel" formControlName="phoneNumber" placeholder="Nhập số điện thoại" />
                </z-form-control>
            </z-form-field>
        </div>

        <!-- Trạng thái (Chỉ hiện khi chỉnh sửa) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6" *ngIf="isEdit">
            <z-form-field class="md:col-span-2">
                <label z-form-label zRequired>Trạng thái</label>
                <z-form-control>
                    <z-select formControlName="status" zPlaceholder="Chọn trạng thái">
                        <z-select-item zValue="ACTIVE">Hoạt động (ACTIVE)</z-select-item>
                        <z-select-item zValue="INACTIVE">Không hoạt động (INACTIVE)</z-select-item>
                        <z-select-item zValue="RESIGNED">Đã nghỉ việc (RESIGNED)</z-select-item>
                    </z-select>
                </z-form-control>
            </z-form-field>
        </div>

        <!-- Divider -->
        <z-divider />

        <!-- Actions -->
        <div class="flex justify-end gap-3 mt-6">
            <a z-button zType="outline" routerLink="/settings/staff">
                Hủy
            </a>
            <button z-button zType="default" type="submit" [zDisabled]="isLoading || staffForm.invalid">
                {{ isEdit ? 'Cập nhật' : 'Thêm mới' }}
            </button>
        </div>

    </form>
</z-card>
