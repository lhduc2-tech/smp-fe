<div class="staff-form-container">
    <div class="header">
        <a routerLink="/settings/staff" class="btn-back" title="Quay lại">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" style="width: 20px; height: 20px;">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <h1>{{ isEdit ? 'Chỉnh sửa nhân viên' : 'Thêm nhân viên mới' }}</h1>
    </div>

    <div class="form-card">
        <form (ngSubmit)="submitForm()" [formGroup]="staffForm">
            <div class="form-group">
                <label>Tên nhân viên <span class="required-asterisk">*</span></label>
                <input type="text" formControlName="fullName" placeholder="Nhập tên nhân viên" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email <span class="required-asterisk">*</span></label>
                    <input type="email" formControlName="email" placeholder="Nhập email" required>
                </div>

                <div class="form-group">
                    <label>Số điện thoại <span class="required-asterisk">*</span></label>
                    <input type="tel" formControlName="phoneNumber" placeholder="Nhập số điện thoại" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Trạng thái <span class="required-asterisk">*</span></label>
                    <select formControlName="status" required>
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                        <option value="RESIGNED">RESIGNED</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Chức vụ <span class="required-asterisk">*</span></label>
                    <select formControlName="position" required>
                        <option value="CASHIER">CASHIER</option>
                        <option value="WAREHOUSE">WAREHOUSE</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <a routerLink="/settings/staff" class="btn-cancel">Hủy</a>
                <button type="submit" class="btn-submit" [disabled]="isLoading || staffForm.invalid">
                    {{ isEdit ? 'Cập nhật' : 'Thêm mới' }}
                </button>
            </div>
        </form>
    </div>
</div>
