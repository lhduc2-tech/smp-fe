<z-card [zTitle]="isEdit ? 'Chỉnh sửa nhân viên' : 'Thêm nhân viên mới'" zDescription="Quản lý thông tin nhân viên"
    class="staff-form-card">
    <form [formGroup]="staffForm" (ngSubmit)="submitForm()" class="space-y-6">

        <!-- Tên nhân viên -->
        <z-form-field>
            <label z-form-label zRequired>Tên nhân viên</label>
            <z-form-control>
                <input z-input type="text" formControlName="fullName" placeholder="Nhập tên nhân viên" />
            </z-form-control>
        </z-form-field>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Email -->
            <z-form-field>
                <label z-form-label zRequired>Email</label>
                <z-form-control>
                    <input z-input type="email" formControlName="email" placeholder="Nhập email" />
                </z-form-control>
            </z-form-field>

            <!-- Số điện thoại -->
            <z-form-field>
                <label z-form-label zRequired>Số điện thoại</label>
                <z-form-control>
                    <input z-input type="tel" formControlName="phoneNumber" placeholder="Nhập số điện thoại" />
                </z-form-control>
            </z-form-field>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Trạng thái -->
            <z-form-field>
                <label z-form-label zRequired>Trạng thái</label>
                <z-form-control>
                    <select formControlName="status"
                        class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50">
                        <option value="ACTIVE">Hoạt động (ACTIVE)</option>
                        <option value="INACTIVE">Không hoạt động (INACTIVE)</option>
                        <option value="RESIGNED">Đã nghỉ việc (RESIGNED)</option>
                    </select>
                </z-form-control>
            </z-form-field>

            <!-- Chức vụ -->
            <z-form-field>
                <label z-form-label zRequired>Chức vụ</label>
                <z-form-control>
                    <select formControlName="position"
                        class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50">
                        <option value="CASHIER">Thu ngân (CASHIER)</option>
                        <option value="WAREHOUSE">Thủ kho (WAREHOUSE)</option>
                    </select>
                </z-form-control>
            </z-form-field>
        </div>

        <!-- Divider -->
        <z-divider />

        <!-- Actions -->
        <div class="flex justify-end gap-3 mt-6">
            <a z-button zType="outline" routerLink="/settings/staff">
                Hủy
            </a>
            <button z-button zType="default" type="submit" [zDisabled]="isLoading || staffForm.invalid">
                {{ isEdit ? 'Cập nhật' : 'Thêm mới' }}
            </button>
        </div>

    </form>
</z-card>
