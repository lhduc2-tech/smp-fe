<div class="admin-page">

  <z-card>

    <!-- ===== Header ===== -->
    <div class="page-header">
      <h1 class="page-title">Quản lý danh mục</h1>

      <a
        z-button
        routerLink="add"
        zType="outline"
        zSize="default"
      >
        + Thêm danh mục
      </a>
    </div>

    <!-- ===== Search ===== -->
    <div class="toolbar">
      <div class="search-box">
        <input
          type="text"
          placeholder="Tìm kiếm theo tên danh mục..."
          [(ngModel)]="searchTerm"
          (keyup.enter)="onSearch()"
        />

        <button
          z-button
          zType="default"
          (click)="onSearch()"
        >
          <z-icon zType="search" />
        </button>
      </div>
    </div>

    <!-- ===== Table ===== -->
    <div class="table-wrapper">

      <!-- Loading -->
      <div *ngIf="isLoading" class="state loading">
        <z-button zLoading zDisabled>
          Đang tải dữ liệu...
        </z-button>
      </div>

      <!-- Data -->
      <table *ngIf="!isLoading && categories.length > 0" class="data-table">
        <thead>
          <tr>
            <th>Tên danh mục</th>
            <th>Mô tả</th>
            <th>Ngày tạo</th>
            <th class="text-center">Hành động</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let c of categories">
            <td>{{ c.categoryName }}</td>
            <td>{{ c.categoryDescription || '-' }}</td>
            <td>{{ c.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
            <td class="text-center">
              <div class="flex gap-2 justify-center">

                <button
                  z-button
                  zSize="sm"
                  [routerLink]="c.id"
                >
                  <z-icon zType="edit" />
                </button>

                <button
                  z-button
                  zType="destructive"
                  zSize="sm"
                  (click)="deleteCategory(c.id)"
                >
                  <z-icon zType="trash" />
                </button>

              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination -->
      <div class="pagination" *ngIf="!isLoading && totalPages > 1">
        ...
      </div>

      <!-- Empty -->
      <div *ngIf="!isLoading && categories.length === 0" class="state empty">
        <p>Không tìm thấy danh mục</p>
        <button z-button zType="secondary" (click)="loadCategories()">
          Thử lại
        </button>
      </div>

    </div>

  </z-card>

</div>
