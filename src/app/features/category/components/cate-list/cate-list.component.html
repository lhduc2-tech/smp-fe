<z-card class="rounded-2xl shadow-sm p-8">

  <div class="space-y-8">

    <!-- ================= TITLE ================= -->
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">
        Quản lý danh mục
      </h1>
    </div>

    <!-- ================= TOOLBAR (Search + Add Button) ================= -->
    <div class="flex items-center justify-between">

      <!-- Search -->
      <div class="flex items-center gap-3 w-full max-w-md">

        <input
          type="text"
          class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary/40 transition"
          placeholder="Tìm kiếm theo tên danh mục..."
          [(ngModel)]="searchTerm"
          (keyup.enter)="onSearch()"
        />

        <button
          z-button
          zType="default"
          (click)="onSearch()"
        >
          <z-icon zType="search" />
        </button>

      </div>

      <!-- Add Button -->
      <a
        z-button
        routerLink="add"
        zType="outline"
      >
        + Thêm danh mục
      </a>

    </div>

    <!-- ================= CONTENT ================= -->
    <div class="space-y-6">

      <!-- Loading -->
      <div *ngIf="isLoading" class="flex justify-center py-10">
        <z-button zLoading zDisabled>
          Đang tải dữ liệu...
        </z-button>
      </div>

      <!-- Table -->
      <div
        *ngIf="!isLoading && categories.length > 0"
        class="overflow-x-auto rounded-xl border"
      >
        <table class="w-full text-sm">

          <thead class="bg-muted/40">
            <tr>
              <th class="p-4 text-left font-medium">Tên danh mục</th>
              <th class="p-4 text-left font-medium">Mô tả</th>
              <th class="p-4 text-left font-medium">Ngày tạo</th>
              <th class="p-4 text-center font-medium">Hành động</th>
            </tr>
          </thead>

          <tbody class="divide-y">

            <tr
              *ngFor="let c of categories"
              class="hover:bg-muted/30 transition-colors"
            >
              <td class="p-4 font-medium">
                {{ c.categoryName }}
              </td>

              <td class="p-4 text-muted-foreground">
                {{ c.categoryDescription || '-' }}
              </td>

              <td class="p-4">
                {{ c.createdAt | date:'dd/MM/yyyy HH:mm' }}
              </td>

              <td class="p-4">
                <div class="flex gap-2 justify-center">

                  <button
                    z-button
                    zSize="sm"
                    [routerLink]="c.id"
                  >
                    <z-icon zType="edit" />
                  </button>

                  <button
                    z-button
                    zType="destructive"
                    zSize="sm"
                    (click)="deleteCategory(c.id)"
                  >
                    <z-icon zType="trash" />
                  </button>

                </div>
              </td>
            </tr>

          </tbody>
        </table>
      </div>

      <!-- Empty -->
      <div
        *ngIf="!isLoading && categories.length === 0"
        class="text-center py-14 border rounded-xl"
      >
        <p class="text-muted-foreground mb-4">
          Không tìm thấy danh mục
        </p>

        <button
          z-button
          zType="secondary"
          (click)="loadCategories()"
        >
          Thử lại
        </button>
      </div>

    </div>
<!-- ================= PAGINATION ================= -->
<div
  *ngIf="!isLoading && totalPages > 1"
  class="pt-6 border-t flex justify-center"
>
  <z-pagination
    [zPageIndex]="currentPage + 1"
    [zTotal]="totalPages"
    (zPageIndexChange)="onPageChange($event - 1)"
  >
    <ul z-pagination-content>

      <!-- Previous -->
      <li z-pagination-item>
        <z-pagination-previous
          [zDisabled]="currentPage === 0"
          (click)="onPageChange(currentPage - 1)"
        />
      </li>

      <!-- Page Numbers -->
      <li
        z-pagination-item
        *ngFor="let page of displayPages"
      >
        <ng-container *ngIf="page !== '...'; else ellipsisTpl">
          <button
            z-pagination-button
            [zActive]="currentPage === page"
            (click)="onPageChange(page)"
          >
            {{ getPageLabel(page) }}
          </button>
        </ng-container>

        <ng-template #ellipsisTpl>
          <z-pagination-ellipsis />
        </ng-template>
      </li>

      <!-- Next -->
      <li z-pagination-item>
        <z-pagination-next
          [zDisabled]="currentPage === totalPages - 1"
          (click)="onPageChange(currentPage + 1)"
        />
      </li>

    </ul>
  </z-pagination>
</div>
  </div>

</z-card>
