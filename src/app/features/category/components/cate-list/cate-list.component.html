<z-card class="flex flex-col gap-6">

  <!-- ===== Header ===== -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold">
      Quản lý danh mục
    </h1>

    <a
      z-button
      routerLink="add"
      zType="outline"
    >
      + Thêm danh mục
    </a>
  </div>

  <!-- ===== Toolbar ===== -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2 w-full max-w-md">

      <input
        type="text"
        class="flex-1 border rounded-md px-3 py-2"
        placeholder="Tìm kiếm theo tên danh mục..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
      />

      <button
        z-button
        zType="default"
        (click)="onSearch()"
      >
        <z-icon zType="search" />
      </button>

    </div>
  </div>

  <!-- ===== Content ===== -->
  <div class="flex flex-col gap-4">

    <!-- Loading -->
    <div *ngIf="isLoading" class="flex justify-center py-8">
      <z-button zLoading zDisabled>
        Đang tải dữ liệu...
      </z-button>
    </div>

    <!-- Data Table -->
    <div *ngIf="!isLoading && categories.length > 0" class="overflow-x-auto">
      <table class="w-full border-collapse text-sm">

        <thead class="bg-muted/40">
          <tr>
            <th class="text-left p-3">Tên danh mục</th>
            <th class="text-left p-3">Mô tả</th>
            <th class="text-left p-3">Ngày tạo</th>
            <th class="text-center p-3">Hành động</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let c of categories"
            class="border-t"
          >
            <td class="p-3">{{ c.categoryName }}</td>
            <td class="p-3">{{ c.categoryDescription || '-' }}</td>
            <td class="p-3">{{ c.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
            <td class="p-3 text-center">
              <div class="flex gap-2 justify-center">

                <button
                  z-button
                  zSize="sm"
                  [routerLink]="c.id"
                >
                  <z-icon zType="edit" />
                </button>

                <button
                  z-button
                  zType="destructive"
                  zSize="sm"
                  (click)="deleteCategory(c.id)"
                >
                  <z-icon zType="trash" />
                </button>

              </div>
            </td>
          </tr>
        </tbody>

      </table>
    </div>

    <!-- Empty -->
    <div
      *ngIf="!isLoading && categories.length === 0"
      class="text-center py-10"
    >
      <p class="text-muted-foreground mb-4">
        Không tìm thấy danh mục
      </p>

      <button
        z-button
        zType="secondary"
        (click)="loadCategories()"
      >
        Thử lại
      </button>
    </div>

  </div>

  <!-- ===== Pagination ===== -->
  <div
    *ngIf="!isLoading && totalPages > 1"
    class="flex justify-center pt-4 border-t"
  >
    <div class="flex gap-2">
      ...
    </div>
  </div>

</z-card>
