<div class="staff-list-container">

  <!-- Header -->
  <div class="header">
    <h1>Quản lý danh mục</h1>
    <z-button-group>
      <a routerLink="add" class="btn-add">
        + Thêm danh mục
      </a>
    </z-button-group>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-bar">
      <input
        type="text"
        placeholder="Tìm kiếm theo tên danh mục..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
      />
      <button class="search-btn" (click)="onSearch()">
        <app-icon type="search"></app-icon>
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="staff-table">

    <!-- Loading -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu...</p>
    </div>

    <!-- Data table -->
    <table *ngIf="!isLoading && categories.length > 0">
      <thead>
        <tr>
          <th>Tên danh mục</th>
          <th>Mô tả</th>
          <th>Ngày tạo</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of categories">
          <td>{{ c.categoryName }}</td>
          <td>{{ c.categoryDescription || '-' }}</td>
          <td>{{ c.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>
            <z-button-group zOrientation="horizontal">
              <button class="action-icon" [routerLink]="c.id">
                <app-icon type="edit"></app-icon>
              </button>

              <button class="action-icon" (click)="deleteCategory(c.id)">
                <app-icon type="delete"></app-icon>
              </button>
            </z-button-group>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination" *ngIf="!isLoading && totalPages > 1">

      <button
        [disabled]="currentPage === 0"
        (click)="onPageChange(0)"
        class="page-nav"
      >
        &laquo;
      </button>

      <button
        [disabled]="currentPage === 0"
        (click)="onPageChange(currentPage - 1)"
        class="page-nav"
      >
        &lsaquo;
      </button>

      <div class="pages">
        <ng-container *ngFor="let page of displayPages">
          <button
            *ngIf="page !== '...'; else dots"
            [class.active]="page === currentPage"
            (click)="onPageChange(page)"
          >
            {{ getPageLabel(page) }}
          </button>

          <ng-template #dots>
            <span class="dots">...</span>
          </ng-template>
        </ng-container>
      </div>

      <button
        [disabled]="currentPage === totalPages - 1"
        (click)="onPageChange(currentPage + 1)"
        class="page-nav"
      >
        &rsaquo;
      </button>

      <button
        [disabled]="currentPage === totalPages - 1"
        (click)="onPageChange(totalPages - 1)"
        class="page-nav"
      >
        &raquo;
      </button>

    </div>

    <!-- No data -->
    <div *ngIf="!isLoading && categories.length === 0" class="no-data">
      <p>Không tìm thấy danh mục</p>
      <button (click)="loadCategories()" class="btn-retry">
        Thử lại
      </button>
    </div>

  </div>
</div>
