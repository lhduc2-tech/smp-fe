<z-card
  [zTitle]="isEdit ? 'Chỉnh sửa permission' : 'Thêm permission mới'"
  zDescription="Quản lý quyền truy cập hệ thống"
  class="permission-form-card"
>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

    <!-- Code -->
    <z-form-field>
      <label z-form-label zRequired>Permission Code</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="code"
          placeholder="Ví dụ: user:create"
        />
      </z-form-control>
    </z-form-field>

    <!-- Description -->
    <z-form-field>
      <label z-form-label>Mô tả</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="description"
          placeholder="Nhập mô tả permission"
        />
      </z-form-control>
    </z-form-field>

    <z-divider />

    <!-- Actions -->
    <div class="form-actions">

      <a z-button zType="outline" routerLink="/permissions">
        Hủy
      </a>

      <button
        z-button
        zType="default"
        type="submit"
        [zDisabled]="form.invalid"
      >
        {{ isEdit ? 'Cập nhật' : 'Thêm mới' }}
      </button>

    </div>

  </form>

</z-card>
