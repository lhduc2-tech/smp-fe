<div class="staff-list-container">
  <!-- Header -->
  <div class="header">
    <h1>Quản lý sản phẩm</h1>
    <a routerLink="add" class="btn-add">+ Thêm sản phẩm</a>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-bar">
      <input
        type="text"
        placeholder="Tìm kiếm theo tên hoặc mã sản phẩm..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
      />
      <button class="search-btn" (click)="onSearch()">
        <app-icon type="search"></app-icon>
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="staff-table">
    <!-- Loading -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu...</p>
    </div>

    <!-- Data table -->
    <table *ngIf="!isLoading && products.length > 0">
      <thead>
        <tr>
          <th>Mã sản phẩm</th>
          <th>Tên sản phẩm</th>
          <th>Giá</th>
          <th>Ngày tạo</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of products">
          <td>{{ p.code }}</td>
          <td>{{ p.name }}</td>
          <td>{{ p.price | number }}</td>
          <td>{{ p.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
          <td>
            <div class="actions">
              <a [routerLink]="p.id" class="action-icon" title="Sửa">
                <app-icon type="edit"></app-icon>
              </a>
              <button
                (click)="deleteProduct(p.id)"
                class="action-icon"
                title="Xóa"
              >
                <app-icon type="delete"></app-icon>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination" *ngIf="!isLoading && totalPages > 1">
      <button
        [disabled]="currentPage === 0"
        (click)="onPageChange(0)"
        class="page-nav"
      >
        &laquo;
      </button>

      <button
        [disabled]="currentPage === 0"
        (click)="onPageChange(currentPage - 1)"
        class="page-nav"
      >
        &lsaquo;
      </button>

      <div class="pages">
        <ng-container *ngFor="let page of displayPages">
          <button
            *ngIf="page !== '...'; else dots"
            [class.active]="page === currentPage"
            (click)="onPageChange(page)"
          >
            {{ getPageLabel(page) }}
          </button>
          <ng-template #dots>
            <span class="dots">...</span>
          </ng-template>
        </ng-container>
      </div>

      <button
        [disabled]="currentPage === totalPages - 1"
        (click)="onPageChange(currentPage + 1)"
        class="page-nav"
      >
        &rsaquo;
      </button>

      <button
        [disabled]="currentPage === totalPages - 1"
        (click)="onPageChange(totalPages - 1)"
        class="page-nav"
      >
        &raquo;
      </button>
    </div>

    <!-- No data -->
    <div *ngIf="!isLoading && products.length === 0" class="no-data">
      <p>Không tìm thấy sản phẩm</p>
      <button (click)="loadProducts()" class="btn-retry">
        Thử lại
      </button>
    </div>
  </div>
</div>
