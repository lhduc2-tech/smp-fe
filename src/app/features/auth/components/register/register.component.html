<div class="login-container">
  <div class="login-form-section">
    <div class="form-wrapper">

      <h1 class="title">TẠO TÀI KHOẢN</h1>
      <p class="subtitle">Vui lòng điền đầy đủ thông tin của bạn</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">

        <div class="input-group">
          <label>Tên đăng nhập</label>
          <input formControlName="username" placeholder="Nhập tên đăng nhập">
        </div>

        <div class="input-group">
          <label>Email</label>
          <input formControlName="email" placeholder="Nhập email">
        </div>

        <div class="input-group">
          <label>Số điện thoại</label>
          <input formControlName="phoneNumber" placeholder="Nhập số điện thoại">
        </div>

        <div class="input-group">
          <label>Tên cửa hàng</label>
          <input formControlName="shopName" placeholder="Nhập tên cửa hàng">
        </div>

        <div class="input-group">
          <label>Địa chỉ</label>
          <input formControlName="address" placeholder="Nhập địa chỉ">
        </div>

        <div class="input-group">
          <label>Loại cửa hàng</label>
          <input formControlName="shopType" placeholder="Nhập loại cửa hàng">
        </div>

        <div class="input-group">
          <label>Mật khẩu</label>
          <input type="password" formControlName="password" placeholder="********">
        </div>

        <div class="input-group">
          <label>Xác nhận mật khẩu</label>
          <input type="password" formControlName="confirmPassword" placeholder="Nhập lại mật khẩu">
        </div>

        <button type="submit" class="btn-primary btn-signup">
          Tạo tài khoản
        </button>

      </form>

      <p class="signup-text">
        Đã có tài khoản?
        <a routerLink="/login">Đăng nhập</a>
      </p>

    </div>
  </div>

  <div class="login-image-section"></div>
</div>
