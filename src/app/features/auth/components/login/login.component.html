<div class="login-container">
  <div class="login-form-section">
    <div class="form-wrapper">

      <h1 class="title">CHÀO MỪNG QUAY TRỞ LẠI</h1>
      <p class="subtitle">Rất vui được gặp lại bạn! Vui lòng nhập thông tin đăng nhập.</p>

      <!-- FORM ĐĂNG NHẬP -->
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="auth-form"
      >
        <div class="input-group">
          <label for="username">Tên đăng nhập</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Nhập tên đăng nhập"
          >
        </div>

        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="**********"
          >
        </div>

        <button
          type="submit"
          class="btn-primary btn-signin"
          [disabled]="loading"
        >
          Đăng nhập
        </button>
      </form>

      <!-- ĐĂNG NHẬP BẰNG GOOGLE -->
      <div class="google-login-wrapper">
        <div id="google-login-btn"></div>
      </div>

      <!-- LINK ĐĂNG KÝ -->
      <p class="signup-text">
        Chưa có tài khoản?
        <a routerLink="/register">Đăng ký miễn phí!</a>
      </p>

    </div>
  </div>

  <div class="login-image-section"></div>
</div>
