<z-card class="rounded-2xl shadow-sm p-8">

  <div class="space-y-8">

    <!-- ================= HEADER ================= -->
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold tracking-tight">
        Lịch sử kho
      </h1>
    </div>

    <!-- ================= FILTER ================= -->
    <div class="flex items-center gap-3 w-full max-w-md">

      <input
        type="text"
        class="flex-1 h-10 border rounded-lg px-4 focus:outline-none focus:ring-2 focus:ring-primary/40"
        placeholder="Tìm theo sản phẩm..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
      />

      <button z-button zType="default" (click)="onSearch()">
        Tìm
      </button>

    </div>

    <!-- ================= CONTENT ================= -->
    <div class="space-y-6">

      <!-- LOADING -->
      <div *ngIf="isLoading" class="flex justify-center py-10">
        <z-button zLoading zDisabled>
          Đang tải dữ liệu...
        </z-button>
      </div>

      <!-- TABLE -->
      <div *ngIf="!isLoading && stockMovements.length > 0"
           class="overflow-x-auto rounded-xl border">

        <table class="w-full text-sm">

          <thead class="bg-muted/40">
            <tr>
              <th class="p-4 text-left font-medium">Sản phẩm</th>
              <th class="p-4 text-center font-medium">Loại</th>
              <th class="p-4 text-right font-medium">Số lượng</th>
              <th class="p-4 text-left font-medium">Ghi chú</th>
              <th class="p-4 text-center font-medium">Ngày tạo</th>
            </tr>
          </thead>

          <tbody class="divide-y">

            <tr *ngFor="let m of stockMovements"
                class="hover:bg-muted/30 transition">

              <!-- PRODUCT -->
              <td class="p-4 font-medium">
                {{ m.productId }}
              </td>

              <!-- TYPE -->
              <td class="p-4 text-center">
                <z-badge
                  [ngClass]="{
                    'badge-success': m.movementType === 'IMPORT',
                    'badge-destructive': m.movementType === 'EXPORT'
                  }"
                >
                  {{ m.movementType }}
                </z-badge>
              </td>

              <!-- QUANTITY -->
              <td class="p-4 text-right font-semibold">
                {{ m.quantity }}
              </td>

              <!-- NOTE -->
              <td class="p-4 text-muted-foreground">
                {{ m.note || '-' }}
              </td>

              <!-- DATE -->
              <td class="p-4 text-center text-muted-foreground">
                {{ m.createdAt | date:'dd/MM/yyyy HH:mm' }}
              </td>

            </tr>

          </tbody>

        </table>

      </div>

      <!-- EMPTY -->
      <div *ngIf="!isLoading && stockMovements.length === 0"
           class="text-center py-14 border rounded-xl">

        <p class="text-muted-foreground mb-4">
          Không có dữ liệu kho
        </p>

        <button z-button zType="secondary" (click)="loadStockMovements()">
          Tải lại
        </button>

      </div>

    </div>

    <!-- ================= PAGINATION ================= -->
    <div *ngIf="!isLoading && totalPages > 0"
         class="pt-6 flex items-center justify-between">

      <!-- INFO -->
      <div class="text-sm text-muted-foreground">
        Trang {{ currentPage + 1 }} / {{ totalPages }}
      </div>

      <!-- NAV -->
      <div class="flex gap-2">

        <button
          z-button
          zType="outline"
          (click)="onPageChange(currentPage - 1)"
          [disabled]="currentPage === 0">
          ← Trước
        </button>

        <button
          z-button
          zType="outline"
          (click)="onPageChange(currentPage + 1)"
          [disabled]="currentPage === totalPages - 1">
          Sau →
        </button>

      </div>

    </div>

  </div>

</z-card>
