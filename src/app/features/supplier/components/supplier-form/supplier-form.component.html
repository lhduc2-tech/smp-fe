<z-card
  [zTitle]="isEdit ? 'Chỉnh sửa nhà cung cấp' : 'Thêm nhà cung cấp mới'"
  zDescription="Quản lý thông tin nhà cung cấp"
  class="supplier-form-card">

  <form [formGroup]="form"
        (ngSubmit)="submit()"
        class="space-y-6">

    <!-- Tên nhà cung cấp -->
    <z-form-field>
      <label z-form-label zRequired>Tên nhà cung cấp</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="supplierName"
          placeholder="Nhập tên nhà cung cấp" />
      </z-form-control>
    </z-form-field>

    <!-- Mã nhà cung cấp -->
    <z-form-field>
      <label z-form-label zRequired>Mã nhà cung cấp</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="code"
          placeholder="Nhập mã nhà cung cấp" />
      </z-form-control>
    </z-form-field>

    <!-- Số điện thoại -->
    <z-form-field>
      <label z-form-label zRequired>Số điện thoại</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="phoneNumber"
          placeholder="Nhập số điện thoại" />
      </z-form-control>
    </z-form-field>

    <!-- Email -->
    <z-form-field>
      <label z-form-label>Email</label>
      <z-form-control>
        <input
          z-input
          type="email"
          formControlName="email"
          placeholder="Nhập email" />
      </z-form-control>
    </z-form-field>

    <!-- Website -->
    <z-form-field>
      <label z-form-label>Website</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="website"
          placeholder="Nhập website" />
      </z-form-control>
    </z-form-field>

    <!-- Mã số thuế -->
    <z-form-field>
      <label z-form-label>Mã số thuế</label>
      <z-form-control>
        <input
          z-input
          type="text"
          formControlName="taxCode"
          placeholder="Nhập mã số thuế" />
      </z-form-control>
    </z-form-field>

    <!-- Divider -->
    <z-divider />

    <!-- Actions -->
    <div class="form-actions flex justify-end gap-3">
      <a z-button zType="outline" routerLink="/supplier">
        Hủy
      </a>

      <button
        z-button
        zType="default"
        type="submit"
        [zDisabled]="form.invalid">

        {{ isEdit ? 'Cập nhật' : 'Thêm mới' }}

      </button>
    </div>

  </form>

</z-card>
